<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Cloud Letters 배경음악의 피아노 샘플 출처와 라이선스 안내">
  <link rel="icon" href="data:,">
  <title>음원 크레딧 · Cloud Letters</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 3vw, 32px);
      background: #141612;
      color: #eeeee6;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(24px, 4vw, 36px);
      border: 1px solid #373b30;
      background: #1b1e18;
      border-radius: 16px;
    }
    .eyebrow { margin: 0 0 14px; color: #cfba8f; font-size: 12px; letter-spacing: .16em; }
    h1 { margin: 0; font: 400 clamp(36px, 7vw, 48px)/1.12 Georgia, serif; letter-spacing: -.03em; }
    .intro { margin: 16px 0 24px; color: #bdc0b4; font-size: 14px; line-height: 1.85; word-break: keep-all; }
    dl { margin: 0; }
    .credit-row { display: grid; grid-template-columns: 106px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid #35392f; }
    dt { padding-top: 3px; color: #b5b9ab; font-size: 12px; line-height: 1.8; }
    dd { margin: 0; font-size: 15px; line-height: 1.8; overflow-wrap: anywhere; word-break: keep-all; }
    a { color: #e5cc9f; text-underline-offset: 5px; text-decoration-thickness: 1px; }
    a:hover { color: #fff0cf; }
    a:focus-visible { outline: 2px solid #e5cc9f; outline-offset: 5px; border-radius: 2px; }
    .license-name { display: block; margin-top: 3px; color: #b5b9ab; font-size: 12px; }
    footer { margin-top: 20px; padding-top: 12px; border-top: 1px solid #35392f; }
    .back-link { min-height: 44px; display: inline-flex; align-items: center; gap: 10px; font-size: 13px; text-decoration: none; }
    .back-link span { border-bottom: 1px solid currentColor; padding-bottom: 3px; }
    @media (max-width: 480px) {
      .credit-row { grid-template-columns: 1fr; gap: 5px; padding: 16px 0; }
      dt { padding: 0; }
      .intro { margin-bottom: 23px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">음원 크레딧</p>
      <h1>Cloud Letters</h1>
      <p class="intro">이 포트폴리오를 위해 구성한 배경음악입니다.<br>피아노 샘플의 제작자와 사용 허가를 안내합니다.</p>
    </header>
    <dl>
      <div class="credit-row">
        <dt>피아노 샘플</dt>
        <dd>Salamander Grand Piano V2 (Yamaha C5)</dd>
      </div>
      <div class="credit-row">
        <dt>샘플 제작자</dt>
        <dd>Alexander Holm</dd>
      </div>
      <div class="credit-row">
        <dt>라이선스</dt>
        <dd><a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener noreferrer">CC BY 3.0</a><span class="license-name">Creative Commons Attribution 3.0</span></dd>
      </div>
      <div class="credit-row">
        <dt>원본 출처</dt>
        <dd><a href="https://github.com/Tonejs/audio/tree/master/salamander" target="_blank" rel="noopener noreferrer">Salamander 피아노 샘플</a></dd>
      </div>
      <div class="credit-row">
        <dt>수정 사항</dt>
        <dd>샘플의 음높이·음량·음색·잔향을 조절해 이 포트폴리오의 선율과 화음으로 구성했습니다.</dd>
      </div>
    </dl>
    <footer><a class="back-link" href="../../"><span>포트폴리오로 돌아가기</span><span aria-hidden="true">↗</span></a></footer>
  </main>
</body>
</html>
